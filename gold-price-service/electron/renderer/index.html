<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金脉</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="collapsedBall" class="collapsed-card" role="button" tabindex="0" aria-label="展开金价详情" aria-live="polite">
      <div id="collapsedAiIndicator" class="collapsed-ai-indicator" hidden>
        <span class="collapsed-ai-spinner" aria-hidden="true"></span>
        <span class="collapsed-ai-text">AI 分析中</span>
      </div>
      <div class="collapsed-drag-handle" title="按住拖动" aria-hidden="true"></div>
      <div class="collapsed-card-head">
        <span class="collapsed-live"><span class="collapsed-live-dot" aria-hidden="true"></span>积存金 · 元/克</span>
        <span id="collapsedUpdated">--</span>
      </div>
      <div class="collapsed-card-body">
        <div class="collapsed-quotes" aria-label="实时积存金报价">
          <div class="collapsed-quote-row">
            <span>浙商</span>
            <strong id="collapsedZhejiangPrice">--</strong>
            <em>元/克</em>
          </div>
          <div class="collapsed-quote-row">
            <span>民生</span>
            <strong id="collapsedMinshengPrice">--</strong>
            <em>元/克</em>
          </div>
          <div class="collapsed-quote-row">
            <span>工行</span>
            <strong id="collapsedIcbcPrice">--</strong>
            <em>元/克</em>
          </div>
        </div>
        <div id="collapsedProfit" class="collapsed-assets">未设置持仓</div>
      </div>
    </div>

    <main class="shell">
      <header class="titlebar">
        <div class="title">
          <span class="mark" aria-hidden="true"></span>
          <span>金脉</span>
          <span class="live-status" aria-live="polite">
            <span id="liveStatusDot" class="live-status-dot" aria-hidden="true"></span>
            <span id="liveStatus">连接中</span>
          </span>
        </div>
        <div class="window-actions">
          <button id="aiButton" class="icon-button ai-control" type="button" title="AI 分析" aria-label="AI 分析"></button>
          <button id="settingsButton" class="icon-button settings-control" type="button" title="设置" aria-label="打开设置"></button>
          <button id="toggleButton" class="icon-button toggle-control active" type="button" title="折叠" aria-label="折叠" aria-expanded="true"></button>
          <button id="minimizeButton" class="icon-button" type="button" title="最小化" aria-label="最小化">−</button>
          <button id="closeButton" class="icon-button danger" type="button" title="关闭" aria-label="关闭">×</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <div class="deposit-quotes" aria-live="polite">
            <div class="deposit-quote-card">
              <span>浙商积存金</span>
              <div class="deposit-price-line">
                <strong id="currentPrice">--</strong>
                <em>元/克</em>
              </div>
              <small id="changeText" class="change neutral">等待采集</small>
            </div>
            <div class="deposit-quote-card">
              <span>民生积存金</span>
              <div class="deposit-price-line">
                <strong id="minshengPrice">--</strong>
                <em>元/克</em>
              </div>
              <small id="minshengChangeText" class="change neutral">等待采集</small>
            </div>
            <div class="deposit-quote-card">
              <span>工行积存金</span>
              <div class="deposit-price-line">
                <strong id="icbcPrice">--</strong>
                <em>元/克</em>
              </div>
              <small id="icbcChangeText" class="change neutral">等待采集</small>
            </div>
          </div>
          <div class="secondary-quotes" aria-live="polite">
            <div class="secondary-quote exchange-quote">
              <span>美元兑人民币</span>
              <strong id="exchangeRate">--</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="holding-section">
        <div class="section-head">
          <span>我的资产</span>
          <span id="holdingModeHint" class="section-hint">按实时金价估值</span>
        </div>
        <div class="holding-modes" role="tablist" aria-label="持仓估值方式">
          <button class="holding-mode active" type="button" role="tab" aria-selected="true" data-holding-mode="market">积存金</button>
          <button class="holding-mode" type="button" role="tab" aria-selected="false" data-holding-mode="brand">品牌金</button>
          <button class="holding-mode" type="button" role="tab" aria-selected="false" data-holding-mode="recycle">回收金</button>
        </div>
        <div class="holding-assets-toolbar">
          <span id="holdingAssetCount">当前 1 项资产</span>
          <button id="addHoldingButton" class="add-holding-button" type="button">＋ 添加资产</button>
        </div>
        <div id="holdingAssetList" class="holding-asset-list" aria-label="资产列表"></div>
        <div id="holdingForm" class="holding-form">
          <label class="field compact-field">
            <span>持有克数</span>
            <input id="holdingGrams" type="number" min="0" step="any" placeholder="100.00" inputmode="decimal" />
          </label>
          <label class="field compact-field">
            <span>买入价</span>
            <div class="field-input-with-unit">
              <input id="holdingBuyPrice" type="number" min="0" step="0.01" placeholder="980.00" inputmode="decimal" />
              <em>元/克</em>
            </div>
          </label>
          <label id="holdingMarketSourceField" class="field market-source-field">
            <span>积存来源</span>
            <select id="holdingMarketSource" aria-label="选择积存金来源">
              <option value="CZB-JCJ">浙商积存金</option>
              <option value="MS-JCJ">民生积存金</option>
              <option value="ICBC-JCJ">工行积存金</option>
            </select>
          </label>
          <label id="holdingBrandField" class="field brand-field" hidden>
            <span>品牌</span>
            <select id="holdingBrand" aria-label="选择品牌"></select>
          </label>
        </div>
        <div id="holdingQuoteNote" class="holding-quote-note">填入克数和买入价后，实时计算持仓盈亏</div>
        <div class="holding-summary">
          <div>
            <span id="holdingValueLabel">当前估值</span>
            <strong id="holdingValue">--</strong>
          </div>
          <div>
            <span>资产成本</span>
            <strong id="holdingCost">--</strong>
          </div>
          <div class="holding-profit-cell">
            <span>盈亏</span>
            <strong id="holdingProfit">--</strong>
          </div>
        </div>
        <div id="holdingSale" class="holding-sale" hidden>
          <span id="holdingRecycleRate">回收价 --</span>
          <strong id="holdingSaleValue">可卖 --</strong>
          <em id="holdingSaleProfit">卖出盈亏 --</em>
        </div>
      </section>

      <section class="chart-section">
        <div class="section-head">
          <span>价格曲线</span>
          <div class="range-tabs" role="tablist" aria-label="价格时间范围">
            <button class="range-tab" type="button" role="tab" aria-selected="false" data-range="15m">15分钟</button>
            <button class="range-tab" type="button" role="tab" aria-selected="false" data-range="1h">1小时</button>
            <button class="range-tab" type="button" role="tab" aria-selected="false" data-range="1d">1天</button>
            <button class="range-tab active" type="button" role="tab" aria-selected="true" data-range="3m">3个月</button>
          </div>
        </div>
        <div id="signalStrip" class="signal-strip" aria-live="polite"></div>
        <canvas id="priceChart" width="680" height="260" role="img" aria-label="金价走势，移动鼠标查看价格和时间"></canvas>
        <div id="chartTooltip" class="chart-tooltip" role="status" aria-live="polite" hidden></div>
      </section>

      <footer class="footer">
        <span id="collectorStatus">采集器连接中</span>
        <span id="updatedAt">--</span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
