<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 分析</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./analysis.css" />
  </head>
  <body class="analysis-page">
    <main class="analysis-shell">
      <header class="titlebar">
        <div class="title">
          <span class="mark" aria-hidden="true"></span>
          <span>AI 分析</span>
        </div>
        <div class="window-actions">
          <button id="analysisHistoryButton" class="analysis-ghost" type="button">历史</button>
          <button id="analysisExportButton" class="analysis-ghost" type="button" title="导出为图片">导出</button>
          <button id="analysisStartButton" class="analysis-start" type="button">开始分析</button>
          <button id="analysisMinimizeButton" class="icon-button" type="button" title="最小化" aria-label="最小化">−</button>
          <button id="analysisCloseButton" class="icon-button danger" type="button" title="关闭" aria-label="关闭">×</button>
        </div>
      </header>

      <div id="analysisStatus" class="analysis-status" aria-live="polite">点击「开始分析」进行积存金 AI 分析</div>

      <div id="historyPanel" class="history-panel" hidden>
        <div class="history-head">分析记录</div>
        <div id="historyList" class="history-list"></div>
      </div>

      <div id="analysisBody" class="analysis-body">
        <div id="analysisEmpty" class="analysis-empty">点击上方「开始分析」，AI 将结合实时行情、消息面、金友圈观点与你的持仓生成短线分析报告（含建议与风险预警）。</div>
      </div>

      <div id="loadingOverlay" class="loading-overlay" hidden>
        <div class="ai-loader">
          <div class="ai-loader-ring"></div>
          <div class="ai-loader-core">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.5C7.5 2.5 4 4.5 4 7c0 1.2.8 2.4 2 3.3L4.5 19a1 1 0 0 0 .96 1.3h13.08A1 1 0 0 0 19.5 19L18 10.3c1.2-.9 2-2.1 2-3.3 0-2.5-3.5-4.5-8-4.5z"/>
            </svg>
          </div>
          <span class="ai-loader-dot d1"></span>
          <span class="ai-loader-dot d2"></span>
          <span class="ai-loader-dot d3"></span>
        </div>
        <div id="loadingText" class="ai-loader-text">正在分析…</div>
      </div>

      <footer class="analysis-footer">⚠️ 分析仅供参考，不构成投资建议。</footer>
    </main>
    <script src="./html-to-image.js"></script>
    <script src="./analysis.js"></script>
  </body>
</html>
