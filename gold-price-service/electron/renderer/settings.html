<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金脉设置</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body class="settings-page">
    <main class="settings-shell">
      <header class="titlebar settings-titlebar">
        <div class="title">
          <span class="mark" aria-hidden="true"></span>
          <span>设置</span>
        </div>
        <div class="window-actions">
          <button id="settingsMinimizeButton" class="icon-button" type="button" title="最小化" aria-label="最小化">−</button>
          <button id="settingsCloseButton" class="icon-button danger" type="button" title="关闭" aria-label="关闭">×</button>
        </div>
      </header>

      <section class="settings-card">
        <div class="settings-card-head">
          <div>
            <h1>到价提醒</h1>
            <p>价格穿越阈值时通知一次，回到正常范围后自动复位。</p>
          </div>
          <label class="switch" aria-label="启用到价提醒">
            <input id="alertEnabled" type="checkbox" checked />
            <span></span>
          </label>
        </div>
        <div class="alert-thresholds">
          <label class="alert-threshold">
            <span class="alert-threshold-label high">高价</span>
            <span class="amount-input">
              <input id="highAlertPriceInput" type="number" min="1" step="0.01" placeholder="例如 980.00" aria-label="高价提醒价格" />
              <span>元/克</span>
            </span>
          </label>
          <label class="alert-threshold">
            <span class="alert-threshold-label low">低价</span>
            <span class="amount-input">
              <input id="lowAlertPriceInput" type="number" min="1" step="0.01" placeholder="例如 900.00" aria-label="低价提醒价格" />
              <span>元/克</span>
            </span>
          </label>
          <button id="saveAlertButton" class="primary-button" type="button">保存提醒</button>
        </div>
        <div id="alertStatus" class="status-line">正在读取提醒设置</div>
      </section>

      <section class="settings-card notification-card">
        <div class="settings-card-head">
          <div>
            <h2>消息通知</h2>
            <p>到价提醒触发后，推送到你选择的群聊。</p>
          </div>
        </div>
        <div class="notification-tabs" role="tablist" aria-label="通知平台">
          <button class="notification-tab active" type="button" role="tab" aria-selected="true" aria-controls="feishuPanel" data-notification-tab="feishu">飞书</button>
          <button class="notification-tab" type="button" role="tab" aria-selected="false" aria-controls="wecomPanel" data-notification-tab="wecom">企业微信</button>
        </div>
        <div id="feishuPanel" class="notification-panel" role="tabpanel">
          <div class="notification-panel-head">
            <span>飞书群机器人</span>
            <label class="switch" aria-label="启用飞书通知">
              <input id="feishuEnabled" type="checkbox" />
              <span></span>
            </label>
          </div>
          <label class="settings-field">
            <span>Webhook 地址</span>
            <input id="feishuWebhook" type="url" inputmode="url" placeholder="粘贴飞书群机器人 Webhook" autocomplete="off" />
            <small id="feishuWebhookHint">未配置</small>
          </label>
          <label class="settings-field">
            <span>签名密钥（可选）</span>
            <input id="feishuSecret" type="password" placeholder="机器人开启签名校验时填写" autocomplete="new-password" />
            <small id="feishuSecretHint">未配置</small>
          </label>
          <div class="settings-actions">
            <button id="saveFeishuButton" class="primary-button" type="button">保存飞书设置</button>
            <button id="testFeishuButton" class="secondary-button" type="button">发送测试消息</button>
            <button id="clearFeishuButton" class="text-button" type="button">清除配置</button>
          </div>
          <div id="feishuStatus" class="status-line">正在读取飞书设置</div>
        </div>
        <div id="wecomPanel" class="notification-panel" role="tabpanel" hidden>
          <div class="notification-panel-head">
            <span>企业微信群机器人</span>
            <label class="switch" aria-label="启用企业微信通知">
              <input id="wecomEnabled" type="checkbox" />
              <span></span>
            </label>
          </div>
          <label class="settings-field">
            <span>Webhook 地址</span>
            <input id="wecomWebhook" type="url" inputmode="url" placeholder="粘贴企业微信群机器人 Webhook" autocomplete="off" />
            <small id="wecomWebhookHint">未配置</small>
          </label>
          <div class="settings-actions">
            <button id="saveWecomButton" class="primary-button" type="button">保存企业微信设置</button>
            <button id="testWecomButton" class="secondary-button" type="button">发送测试消息</button>
            <button id="clearWecomButton" class="text-button" type="button">清除配置</button>
          </div>
          <div id="wecomStatus" class="status-line">正在读取企业微信设置</div>
        </div>
      </section>

    </main>
    <script src="./settings.js"></script>
  </body>
</html>
