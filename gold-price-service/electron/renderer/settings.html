<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金脉设置</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body class="settings-page">
    <main class="settings-shell">
      <header class="titlebar settings-titlebar">
        <div class="title">
          <span class="mark" aria-hidden="true"></span>
          <span>设置</span>
        </div>
        <div class="window-actions settings-toolbar">
          <span id="backupStatus" class="toolbar-status" aria-live="polite"></span>
          <button id="importDataButton" class="icon-button toolbar-button" type="button" data-tooltip="导入备份" aria-label="导入备份">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 12-4-4m4 4 4-4M5 21h14a2 2 0 0 0 2-2v-4M3 15v4a2 2 0 0 0 2 2" /></svg>
          </button>
          <button id="exportJsonButton" class="icon-button toolbar-button" type="button" data-tooltip="导出 JSON" aria-label="导出 JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 13h8M8 17h6" /></svg><small>JSON</small>
          </button>
          <button id="exportCsvButton" class="icon-button toolbar-button" type="button" data-tooltip="导出 CSV" aria-label="导出 CSV">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 13h8M8 17h8" /></svg><small>CSV</small>
          </button>
          <button id="exportXlsxButton" class="icon-button toolbar-button" type="button" data-tooltip="导出 XLSX" aria-label="导出 XLSX">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 12h8M8 16h8M12 10v8" /></svg><small>XLSX</small>
          </button>
          <button id="settingsMinimizeButton" class="icon-button toolbar-button" type="button" data-tooltip="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button id="settingsCloseButton" class="icon-button danger toolbar-button" type="button" data-tooltip="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </header>

      <div class="settings-content">
      <section class="settings-card">
        <div class="settings-card-head">
          <div>
            <h1>到价提醒</h1>
            <p>价格穿越阈值时通知一次，回到正常范围后自动复位。</p>
          </div>
          <label class="switch" aria-label="启用到价提醒">
            <input id="alertEnabled" type="checkbox" checked />
            <span></span>
          </label>
        </div>
        <div class="alert-thresholds">
          <label class="alert-threshold">
            <span class="alert-threshold-label high">高价</span>
            <span class="amount-input">
              <input id="highAlertPriceInput" type="number" min="1" step="0.01" placeholder="" aria-label="高价提醒价格" />
              <span>元/克</span>
            </span>
          </label>
          <label class="alert-threshold">
            <span class="alert-threshold-label low">低价</span>
            <span class="amount-input">
              <input id="lowAlertPriceInput" type="number" min="1" step="0.01" placeholder="" aria-label="低价提醒价格" />
              <span>元/克</span>
            </span>
          </label>
          <label class="settings-field alert-source-field cooldown-field">
            <span>重复提醒间隔</span>
            <select id="alertCooldownSelect">
               <option value="0">仅首次穿越（复位后再通知）</option>
               <option value="1800">每次穿越间隔 30 分钟</option>
               <option value="3600">每次穿越间隔 1 小时</option>
               <option value="86400">每次穿越间隔 1 天</option>
             </select>
             <small id="alertCooldownHint">仅首次穿越提醒，价格回到正常区间后自动复位。</small>
           </label>
          <button id="saveAlertButton" class="primary-button" type="button">保存提醒</button>
        </div>
        <div id="alertStatus" class="status-line">正在读取提醒设置</div>
        <div class="alert-history-head"><span>最近通知记录</span><span class="alert-history-actions"><button id="testAlertButton" class="text-button" type="button">测试提醒</button><button id="simulateAlertButton" class="text-button" type="button">动态演示</button></span></div>
        <div id="alertHistory" class="alert-history"><span class="empty-state">暂无通知记录</span></div>
      </section>

      <section class="settings-card notification-card">
        <div class="settings-card-head">
          <div>
            <h2>消息通知</h2>
            <p>到价提醒触发后，推送到你选择的群聊。</p>
          </div>
        </div>
        <div class="notification-tabs" role="tablist" aria-label="通知平台">
          <button class="notification-tab active" type="button" role="tab" aria-selected="true" aria-controls="feishuPanel" data-notification-tab="feishu">飞书</button>
          <button class="notification-tab" type="button" role="tab" aria-selected="false" aria-controls="wecomPanel" data-notification-tab="wecom">企业微信</button>
        </div>
        <div id="feishuPanel" class="notification-panel" role="tabpanel">
          <div class="notification-panel-head">
            <span>飞书群机器人</span>
            <label class="switch" aria-label="启用飞书通知">
              <input id="feishuEnabled" type="checkbox" />
              <span></span>
            </label>
          </div>
          <label class="settings-field">
            <span>Webhook 地址</span>
            <input id="feishuWebhook" type="url" inputmode="url" placeholder="粘贴飞书群机器人 Webhook" autocomplete="off" />
            <small id="feishuWebhookHint">未配置</small>
          </label>
          <label class="settings-field">
            <span>签名密钥（可选）</span>
            <input id="feishuSecret" type="password" placeholder="机器人开启签名校验时填写" autocomplete="new-password" />
            <small id="feishuSecretHint">未配置</small>
          </label>
          <div class="settings-actions">
            <button id="saveFeishuButton" class="primary-button" type="button">保存飞书设置</button>
            <button id="testFeishuButton" class="secondary-button" type="button">发送测试消息</button>
            <button id="clearFeishuButton" class="text-button" type="button">清除配置</button>
          </div>
          <div id="feishuStatus" class="status-line">正在读取飞书设置</div>
        </div>
        <div id="wecomPanel" class="notification-panel" role="tabpanel" hidden>
          <div class="notification-panel-head">
            <span>企业微信群机器人</span>
            <label class="switch" aria-label="启用企业微信通知">
              <input id="wecomEnabled" type="checkbox" />
              <span></span>
            </label>
          </div>
          <label class="settings-field">
            <span>Webhook 地址</span>
            <input id="wecomWebhook" type="url" inputmode="url" placeholder="粘贴企业微信群机器人 Webhook" autocomplete="off" />
            <small id="wecomWebhookHint">未配置</small>
          </label>
          <div class="settings-actions">
            <button id="saveWecomButton" class="primary-button" type="button">保存企业微信设置</button>
            <button id="testWecomButton" class="secondary-button" type="button">发送测试消息</button>
            <button id="clearWecomButton" class="text-button" type="button">清除配置</button>
          </div>
          <div id="wecomStatus" class="status-line">正在读取企业微信设置</div>
        </div>
      </section>

      <section class="settings-card llm-card">
        <div class="settings-card-head">
          <div>
            <h2>大模型</h2>
            <p>配置 AI 分析的模型接口，支持 OpenAI 兼容的三方中转（如 DeepSeek 官方或各类中转站）。</p>
          </div>
        </div>
        <div id="llmConfigList" class="llm-config-list"></div>
        <button id="addLlmButton" class="secondary-button llm-add-button" type="button">＋ 添加模型</button>
        <div id="llmForm" class="llm-form" hidden>
          <div class="llm-form-head">
            <span id="llmFormTitle">添加模型</span>
          </div>
          <label class="settings-field">
            <span>名称</span>
            <input id="llmName" type="text" placeholder="如：DeepSeek 官方" autocomplete="off" />
          </label>
          <label class="settings-field">
            <span>接口地址</span>
            <input id="llmBaseUrl" type="url" inputmode="url" placeholder="https://api.deepseek.com" autocomplete="off" />
            <small>OpenAI 兼容地址，自动拼接 /chat/completions</small>
          </label>
          <label class="settings-field">
            <span>密钥</span>
            <input id="llmApiKey" type="password" placeholder="sk-..." autocomplete="new-password" />
            <small id="llmApiKeyHint">密钥仅保存在本地</small>
          </label>
          <label class="settings-field">
            <span>模型</span>
            <input id="llmModel" type="text" placeholder="deepseek-v4-pro" autocomplete="off" />
          </label>
          <div class="settings-actions">
            <button id="llmSaveButton" class="primary-button" type="button">保存</button>
            <button id="llmCancelButton" class="secondary-button" type="button">取消</button>
          </div>
        </div>
        <div id="llmStatus" class="status-line">尚未配置模型</div>
      </section>
      </div>

    </main>
    <script src="./settings.js"></script>
  </body>
</html>
